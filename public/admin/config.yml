backend:
  name: auth0
  auth_endpoint: https://stone-dekor-stroyka-remont.netlify.app/.netlify/identity
  auth0_domain: ${AUTH0_DOMAIN}
  client_id: ${AUTH0_CLIENT_ID}
  audience: ${AUTH0_AUDIENCE}

media_folder: "public/assets/images"
public_folder: "/assets/images"

site_url: https://stone-dekor-stroyka-remont.netlify.app
display_url: https://stone-dekor-stroyka-remont.netlify.app

collections:
  - name: "blog"
    label: "Блог"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "Текст", name: "body", widget: "markdown" }

  - name: "portfolio"
    label: "Портфолио / Галерея"
    folder: "content/portfolio"
    create: true
    fields:
      - { label: "Название проекта", name: "title", widget: "string" }
      - { label: "Описание", name: "description", widget: "text" }
      - { label: "Изображения", name: "images", widget: "list", field: { label: "Изображение", name: "image", widget: "image" } }
      - { label: "Видео (YouTube/VK)", name: "video", widget: "string", required: false }

# Роли
users:
  - email: "89528916189kaa@gmail.com"
    role: admin
  - email: "googlushkin@gmail.com"   # потом заменишь на Максима
    role: editor

roles:
  editor:
    collections:
      - blog
      - portfolio