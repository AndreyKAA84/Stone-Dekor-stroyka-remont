backend:
  name: git-gateway
  branch: main   # или master — какая у тебя ветка

media_folder: "public/img/uploads"
public_folder: "/img/uploads"

site_url: https://stone-dekor-stroyka-remont.netlify.app
display_url: https://stone-dekor-stroyka-remont.netlify.app

# Вход через Google (уже работает!)
auth:
  scope: openid profile email

# Коллекции — то, что Максим будет редактировать
collections:
  - name: "gallery"
    label: "Галерея / Портфолио"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Название проекта", name: "title", widget: "string" }
      - { label: "Описание", name: "description", widget: "text" }
      - { label: "Embed-код видео VK или фото", name: "media", widget: "text", hint: "Вставь embed-код из VK или ссылку на фото" }
      - { label: "Дата", name: "date", widget: "datetime" }

  - name: "blog"
    label: "Блог / Новости"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Текст поста", name: "body", widget: "markdown" }
      - { label: "Дата", name: "date", widget: "datetime", default: "{{now}}" }

  - name: "settings"
    label: "Настройки сайта (темы и заставка)"
    files:
      - file: "content/settings/theme.yml"
        label: "Темы и цвета"
        name: "theme"
        fields:
          - { label: "Текущая тема", name: "current", widget: "select", options: ["light", "dark", "new-year", "march-8"], default: "light" }
          - { label: "Видео на главной (embed)", name: "hero_video", widget: "text" }