backend:
  name: git-gateway
  branch: main
  base_url: https://stone-dekor-stroyka-remont.netlify.app/.netlify/functions

media_folder: "public/img/uploads"
public_folder: "/img/uploads"

site_url: https://stone-dekor-stroyka-remont.netlify.app

auth:
  type: oauth
  provider: auth0
  domain: dev-xxx.eu.auth0.com           # ← ТВОЙ РЕАЛЬНЫЙ DOMAIN
  clientID: 344170084750-40d6v756e7k8qfbd9e31nm8uv4auvv0n  # ← ТВОЙ CLIENT ID
  redirectURI: https://stone-dekor-stroyka-remont.netlify.app/.netlify/functions/auth-callback

collections:
  - name: gallery
    label: "Галерея / Портфолио"
    folder: "content/gallery"
    create: true
    fields:
      - { label: "Название", name: title, widget: string }
      - { label: "Описание", name: body, widget: markdown }
      - { label: "Embed VK", name: embed, widget: text }
      - { label: "Дата", name: date, widget: datetime }

  - name: blog
    label: "Блог"
    folder: "content/blog"
    create: true
    fields:
      - { label: "Заголовок", name: title, widget: string }
      - { label: "Текст", name: body, widget: markdown }
      - { label: "Дата", name: date, widget: datetime }

  - name: settings
    label: "Настройки"
    files:
      - file: "content/settings/site.yml"
        label: "Тема"
        fields:
          - { label: "Тема", name: theme, widget: select, options: ["light","dark","new-year","march-8"], default: "light" }
          - { label: "Видео на главной", name: hero_video, widget: text }